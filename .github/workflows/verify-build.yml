name: Verify Build (compile only, no release)

on:
  workflow_dispatch:          # 手动点 Run workflow 可任选分支
  pull_request:               # 打开 PR 到 main 时自动编译验证
    branches: [main]

jobs:
  verify-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 编译验证需要 rootfs 层解到 assets（否则 assembleDebug 可能因缺 asset 失败）。
      # layers-v3 属于上游 4ier/lilclaw（fork 没有该 release），显式 --repo 指向上游。
      - name: Download rootfs layers (for compile)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/rootfs
          gh release download layers-v3 --repo 4ier/lilclaw --pattern "*.tar.gz" --dir /tmp/layers
          for f in /tmp/layers/*.tar.gz; do
            cp "$f" "app/src/main/assets/rootfs/$(basename "$f").bin"
          done
          ls -lh app/src/main/assets/rootfs/

      # 只编译 debug + 跑单测，不发布、不弹 release。
      - name: Assemble debug + unit tests
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew testDebugUnitTest
